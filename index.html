<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>RDAD | دردشة ذكية</title>
<style>
:root{color-scheme:dark;--gold:#d7ad55;--bg:#090909;--panel:#141414;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#242016 0,#090909 45%);color:#f7f2e8;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.app{width:min(760px,100%);height:min(850px,92vh);min-height:560px;background:#101010;border:1px solid #4b3a1c;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px #000}
header{padding:22px 24px;border-bottom:1px solid #302719;display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#f0d28c,#9b6e25);color:#17110a;display:grid;place-items:center;font-weight:900;font-size:20px}h1{font-size:22px;margin:0;color:var(--gold)}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
#chat{padding:22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:13px 16px;border-radius:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#222;border:1px solid #38322a}.user{align-self:flex-end;background:#4a3719;color:#fff2d7}.typing{color:var(--gold);font-size:13px;padding:0 8px;display:none}
form{padding:16px;border-top:1px solid #302719;display:flex;gap:10px}textarea{flex:1;resize:none;max-height:130px;min-height:52px;border:1px solid #514126;border-radius:14px;background:#191919;color:white;padding:14px;font:inherit;outline:none}textarea:focus{border-color:var(--gold)}button{border:0;border-radius:14px;background:var(--gold);color:#17110a;font-weight:bold;padding:0 22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.note{text-align:center;color:#888;font-size:11px;padding:0 10px 12px}
@media(max-width:520px){body{padding:0}.app{height:100vh;min-height:0;border-radius:0}.msg{max-width:92%}header{padding:16px}form{padding:12px}button{padding:0 16px}}
</style></head>
<body><main class="app">
<header><div class="logo">R</div><div><h1>RDAD</h1><p>مساعدك الذكي — اسأل وتلقى الرد</p></div></header>
<section id="chat" aria-live="polite"><div class="msg bot">هلا بك في RDAD 👋 اكتب سؤالك وأنا أساعدك.</div></section>
<div class="typing" id="typing">RDAD يكتب الآن...</div>
<form id="form"><textarea id="message" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك" required></textarea><button id="send" type="submit">إرسال</button></form>
<div class="note">قد يخطئ المساعد أحيانًا؛ راجع المعلومات المهمة.</div>
</main>
<script>
const form=document.getElementById('form'),input=document.getElementById('message'),chat=document.getElementById('chat'),send=document.getElementById('send'),typing=document.getElementById('typing');
function add(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';send.disabled=true;typing.style.display='block';try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await res.json();if(!res.ok)throw new Error(data.error||'تعذر الحصول على رد');add(data.reply||'ما قدرت أجهز ردًا الآن.','bot')}catch(err){add(err.message==='Failed to fetch'?'خدمة الذكاء الاصطناعي غير مربوطة بعد. يلزم نشر واجهة الخادم وإضافة مفتاح API.':err.message,'bot')}finally{typing.style.display='none';send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
