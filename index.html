<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>RDAD | دردشة ذكية</title>
<style>
:root{color-scheme:dark;--gold:#d7ad55;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#242016 0,#090909 45%);color:#f7f2e8;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(760px,100%);height:min(850px,94vh);min-height:560px;background:#101010;border:1px solid #4b3a1c;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px #000}header{padding:18px 24px;border-bottom:1px solid #302719;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#f0d28c,#9b6e25);color:#17110a;display:grid;place-items:center;font-weight:900;font-size:20px}h1{font-size:22px;margin:0;color:var(--gold)}header p{margin:5px 0 0;color:var(--muted);font-size:13px}button{border:0;border-radius:12px;background:var(--gold);color:#17110a;font-weight:bold;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.ghost{background:#28231a;color:#f2d89e;border:1px solid #66502b}.auth{margin:auto;width:min(420px,calc(100% - 32px));padding:28px;background:#171717;border:1px solid #4b3a1c;border-radius:20px}.auth h2{color:var(--gold);margin:0 0 8px}.auth p{color:#aaa;font-size:13px;line-height:1.7}.auth label{display:block;margin:16px 0 7px;font-size:13px;color:#ddd}.auth input{width:100%;padding:13px;border:1px solid #514126;border-radius:12px;background:#101010;color:white;font:inherit;direction:ltr;text-align:left}.auth .actions{display:flex;gap:10px;margin-top:20px}.auth .actions button{flex:1}.status{font-size:13px;color:#e7c77e;min-height:20px;margin-top:14px}.hidden{display:none!important}#chat{padding:22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:13px 16px;border-radius:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#222;border:1px solid #38322a}.user{align-self:flex-end;background:#4a3719;color:#fff2d7}.typing{color:var(--gold);font-size:13px;padding:0 8px;display:none}form#chatForm{padding:16px;border-top:1px solid #302719;display:flex;gap:10px}textarea{flex:1;resize:none;max-height:130px;min-height:52px;border:1px solid #514126;border-radius:14px;background:#191919;color:white;padding:14px;font:inherit;outline:none}textarea:focus{border-color:var(--gold)}.note{text-align:center;color:#888;font-size:11px;padding:0 10px 12px}@media(max-width:520px){body{padding:0}.app{height:100vh;min-height:0;border-radius:0}.msg{max-width:92%}header{padding:14px}.auth{padding:22px}form#chatForm{padding:12px}}
</style>
</head>
<body><main class="app">
<header><div class="brand"><div class="logo">R</div><div><h1>RDAD</h1><p>مساعدك الذكي — حسابك ومحادثاتك</p></div></div><button id="logout" class="ghost hidden">تسجيل الخروج</button></header>
<section id="authPanel" class="auth"><h2 id="authTitle">مرحبًا بك في ردّاد</h2><p id="authDescription">سجّل دخولك أو أنشئ حسابًا جديدًا للبدء.</p>
<label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل" minlength="6" required>
<div class="actions"><button id="login" type="button">تسجيل الدخول</button><button id="signup" class="ghost" type="button">إنشاء حساب</button></div><div id="authStatus" class="status" role="status"></div></section>
<section id="chat" class="hidden" aria-live="polite"><div class="msg bot">هلا بك في RDAD 👋 اكتب سؤالك وأنا أساعدك.</div></section>
<div class="typing hidden" id="typing">RDAD يكتب الآن...</div>
<form id="chatForm" class="hidden"><textarea id="message" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك" required></textarea><button id="send" type="submit">إرسال</button></form>
<div class="note">قد يخطئ المساعد أحيانًا؛ راجع المعلومات المهمة.</div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// ضع بيانات مشروع Supabase العامة هنا بعد إنشاء المشروع (Project Settings > API).
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const authPanel=document.getElementById('authPanel'),chat=document.getElementById('chat'),chatForm=document.getElementById('chatForm'),logout=document.getElementById('logout'),status=document.getElementById('authStatus');
const configured=SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY!=='YOUR_SUPABASE_ANON_KEY';
const supabase=configured?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
function showStatus(t){status.textContent=t}
function enter(user){authPanel.classList.add('hidden');chat.classList.remove('hidden');chatForm.classList.remove('hidden');logout.classList.remove('hidden');chat.dataset.email=user.email||''}
function leave(){authPanel.classList.remove('hidden');chat.classList.add('hidden');chatForm.classList.add('hidden');logout.classList.add('hidden')}
if(!configured) showStatus('يلزم ربط RDAD بمشروع Supabase لإكمال تفعيل الحسابات. اتبع خطوات الإعداد بعد حفظ التعديلات.');
else {const {data:{session}}=await supabase.auth.getSession();if(session)enter(session.user);supabase.auth.onAuthStateChange((_event,session)=>{if(session)enter(session.user);else leave()})}
document.getElementById('login').onclick=async()=>{if(!supabase)return showStatus('لم يتم إعداد خدمة الحسابات بعد.');showStatus('جارٍ تسجيل الدخول...');const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});showStatus(error?error.message:'تم تسجيل الدخول.')};
document.getElementById('signup').onclick=async()=>{if(!supabase)return showStatus('لم يتم إعداد خدمة الحسابات بعد.');showStatus('جارٍ إنشاء الحساب...');const {data,error}=await supabase.auth.signUp({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});showStatus(error?error.message:(data.session?'تم إنشاء الحساب وتسجيل الدخول.':'تحقق من بريدك الإلكتروني لتأكيد الحساب.'))};
logout.onclick=async()=>{if(supabase)await supabase.auth.signOut();leave()};
const input=document.getElementById('message'),send=document.getElementById('send'),typing=document.getElementById('typing');
function add(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
chatForm.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;if(!supabase)return;const {data:{session}}=await supabase.auth.getSession();if(!session){leave();return}add(message,'user');input.value='';send.disabled=true;typing.style.display='block';try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({message})});const data=await res.json();if(!res.ok)throw new Error(data.error||'تعذر الحصول على رد');add(data.reply||'ما قدرت أجهز ردًا الآن.','bot')}catch(err){add(err.message,'bot')}finally{typing.style.display='none';send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatForm.requestSubmit()}});
</script></body></html>
